name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Test
        run: node --test "packages/**/*.test.js" "apps/**/*.test.js"
      - name: Demo (end-to-end smoke test)
        run: node apps/cli/dist/index.js demo --quiet
      - name: Build cloud platform (Next.js)
        run: npx next build
        working-directory: apps/web
      # apps/web is not part of the tsc project graph (Next compiles it), so
      # its own libs get their own type-check and test run.
      - name: Typecheck cloud platform tests
        run: npm run typecheck:test
        working-directory: apps/web
      - name: Test cloud platform libs
        run: npm test
        working-directory: apps/web
