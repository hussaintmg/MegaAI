# Executes one MegaAI goal on a GitHub Actions runner. Dispatched by the
# cloud platform (apps/web) when a goal is submitted; reports progress and the
# final delivery back through the platform's executor API and uploads the
# whole workspace as an artifact.

name: Run MegaAI goal

on:
  workflow_dispatch:
    inputs:
      goal_id:
        description: Platform goal id
        required: true
        type: string

concurrency:
  group: goal-${{ inputs.goal_id }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Build the engine
        run: npm run build
      # The trained vision models need onnxruntime-node. It is an optional
      # dependency, so `npm ci` skips it in silence when its native binary
      # cannot be fetched — and the audits then quietly fall back to DOM-only
      # analysis. Retry it here, and let the run continue either way; the
      # executor reports which happened as a `vision` event on the goal.
      - name: Enable the trained vision models
        continue-on-error: true
        run: npm install onnxruntime-node --no-save --no-audit --no-fund
      # Cheap (a couple of seconds) and deterministic, so the UI-purpose,
      # lead-scoring and error-triage models are always present and fresh.
      # The deep vision weights ship in models/ and need no step.
      - name: Train the classical models
        run: node apps/cli/dist/index.js train
      - name: Execute the goal
        env:
          PLATFORM_URL: ${{ secrets.PLATFORM_URL }}
          EXECUTOR_TOKEN: ${{ secrets.EXECUTOR_TOKEN }}
          GOAL_ID: ${{ inputs.goal_id }}
        run: node scripts/executor/run-goal.mjs
      - name: Upload delivery workspace
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: delivery-${{ inputs.goal_id }}
          path: workspace/
          if-no-files-found: ignore
          retention-days: 30
